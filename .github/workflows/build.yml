name: Build

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt5 libxcb-cursor0 patchelf ccache

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Build with Nuitka
        run: bash scripts/build_nuitka.sh --onefile

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-sentinel-linux
          path: dist/ai_sentinel
