name: Lint

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: pip install ruff mypy types-requests

      - name: Ruff lint
        run: ruff check ai_sentinel.py

      - name: Mypy type check
        run: mypy ai_sentinel.py --ignore-missing-imports
